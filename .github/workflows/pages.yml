name: Deploy Pages

# Publishes only the reader-facing files. Project knowledge, agent
# instructions, READMEs, production scripts and the local production preview
# with its working files stay in the repository but are not copied into the
# published tree. suno-lyrics.txt stays, because scene.js loads it. Requires the Pages source "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the published tree
        run: |
          mkdir _site
          git ls-files -z \
            | grep -zvE '^(\.github/|knowledge/|CLAUDE\.md$|README\.md$|video/README\.md$|video/tools/)|(^|/)\.(gitignore|nojekyll)$|\.(py|mjs)$' \
            | grep -zvE '/(preview\.(html|js|css)|cue-sheet\.json|source-manifest\.json|style-prompt\.txt|lyrics\.srt)$' \
            | xargs -0 cp --parents -t _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
