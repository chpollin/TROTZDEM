<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TROTZDEM Videos</title>
<style>
  @font-face { font-family: "Space Mono"; src: url("fonts/SpaceMono-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Space Mono"; src: url("fonts/SpaceMono-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Redaction"; src: url("fonts/Redaction-Regular.ttf"); }
  @font-face { font-family: "Redaction10"; src: url("fonts/Redaction10-Regular.ttf"); }
  @font-face { font-family: "Redaction20"; src: url("fonts/Redaction20-Regular.ttf"); }
  @font-face { font-family: "Redaction35"; src: url("fonts/Redaction35-Regular.ttf"); }
  @font-face { font-family: "Redaction50"; src: url("fonts/Redaction50-Regular.ttf"); }
  @font-face { font-family: "Redaction70"; src: url("fonts/Redaction70-Regular.ttf"); }
  @font-face { font-family: "Redaction100"; src: url("fonts/Redaction100-Regular.ttf"); }
  :root { --void: #000; --bar: #3a3a3a; --fg: #bbb; }
  html, body { margin: 0; height: 100%; background: var(--void); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh;
           position: absolute; inset: 0; margin: auto; cursor: pointer; }
  .render canvas { width: 1920px; height: 1080px; max-width: none; max-height: none; cursor: default; }
  #bar { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--bar); width: 0; }
  #time { position: fixed; right: 12px; bottom: 10px; font: 12px "Space Mono", monospace; color: var(--fg);
          opacity: .5; }
  .render #bar, .render #time { display: none; }
  .embed canvas { cursor: default; }
  .embed #bar, .embed #time { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080" aria-label="Musikvideo"></canvas>
<div id="bar"></div>
<div id="time"></div>
<audio id="a"></audio>
<script>
  // One player for every song: ?song=<folder> loads that folder's analysis.js,
  // timeline.js and scene.js. A scene defines drawScene(ctx, t) and SCENE_END and
  // may declare extra fonts from its own folder as SCENE_FONT_FACES.
  const params = new URLSearchParams(location.search);
  const song = params.get("song") || "neunundachtzig-tabs";
  const render = params.has("render");
  // ?embed: a parent page (versions/live) owns the clock and calls drawAt per frame
  const embed = params.has("embed");
  const SHARED_FONTS = ['400 40px "Space Mono"', '700 40px "Space Mono"', ...[
    "Redaction", "Redaction10", "Redaction20", "Redaction35", "Redaction50", "Redaction70", "Redaction100",
  ].map(f => `40px "${f}"`)];

  const loadScript = src => new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => fail(new Error("cannot load " + src));
    document.body.appendChild(s);
  });

  (async () => {
    for (const f of ["analysis.js", "timeline.js", "scene.js"]) await loadScript(`${song}/${f}`);
    const faces = (typeof SCENE_FONT_FACES === "undefined" ? [] : SCENE_FONT_FACES)
      .map(f => new FontFace(f.family, `url("${song}/${f.url}")`, f.descriptors || {}));
    for (const f of faces) document.fonts.add(f);
    // fonts must be resolved before the first frame, otherwise text metrics differ between frames
    await Promise.all([...SHARED_FONTS.map(f => document.fonts.load(f)), ...faces.map(f => f.load())]);

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    document.title = typeof SCENE_TITLE === "undefined" ? song : SCENE_TITLE;

    if (render) {
      document.body.classList.add("render");
      window.renderFrame = t => { drawScene(ctx, t); return canvas.toDataURL("image/png"); };
      window.sceneReady = true;
      return;
    }
    if (embed) {
      document.body.classList.add("embed");
      window.drawAt = t => drawScene(ctx, t);
      window.sceneReady = true;
      return;
    }
    const audio = document.getElementById("a");
    const bar = document.getElementById("bar");
    const time = document.getElementById("time");
    const start = parseFloat(params.get("t") || "0");
    // http.server answers without byte ranges, so seeking only works on an in-memory copy
    fetch(`${song}/source/audio.wav`).then(r => r.blob()).then(b => {
      audio.src = URL.createObjectURL(b);
      audio.addEventListener("loadedmetadata", () => { audio.currentTime = start; }, { once: true });
    });
    const tick = () => {
      const t = audio.currentTime;
      drawScene(ctx, t);
      bar.style.width = (t / (audio.duration || SCENE_END) * 100) + "%";
      time.textContent = t.toFixed(2);
      requestAnimationFrame(tick);
    };
    const toggle = () => audio.paused ? audio.play() : audio.pause();
    canvas.addEventListener("click", toggle);
    addEventListener("keydown", e => {
      if (e.code === "Space") { e.preventDefault(); toggle(); }
      if (e.code === "ArrowLeft") audio.currentTime = Math.max(0, audio.currentTime - (e.shiftKey ? 0.1 : 2));
      if (e.code === "ArrowRight") audio.currentTime += e.shiftKey ? 0.1 : 2;
    });
    requestAnimationFrame(tick);
  })().catch(e => { window.sceneError = String(e); console.error(e); });
</script>
</body>
</html>
